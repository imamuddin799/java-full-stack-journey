<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport"
	content="width=device-width, initial-scale=1, shrink-to-fit=no" />
<meta http-equiv="x-ua-compatible" content="ie=edge" />
<title>Generic Enquiry Management System (GEMS) - View Enquries</title>
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
<!-- Google Fonts Roboto -->
<link rel="stylesheet"
	href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" />
<!-- MDB -->
<link rel="stylesheet" href="css/bootstrap-5.0.2-dist/css/bootstrap.min.css" />
</head>
<body>
	<table class="table table-striped table-bordered table-hover"
		id="enquiryTable">
		<thead>
			<tr>
				<th scope="col">#</th>
				<th scope="col">Name</th>
				<th scope="col">Course</th>
				<th scope="col">Number</th>
				<th scope="col">Enquiry Date</th>
				<th scope="col">Updated Date</th>
				<th scope="col">Class Mode</th>
				<th scope="col">Status</th>
				<th scope="col">Action</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="enquiry : ${enquiries}">
				<th th:text="${enquiryStat.index} + 1"></th>
				<td th:text="${enquiry.studentName}"></td>
				<td th:text="${enquiry.courseName}"></td>
				<td th:text="${enquiry.studentPhoneNumber}"></td>
				<td th:text="${enquiry.createdDate}"></td>
				<td th:text="${enquiry.updatedDate}"></td>
				<td th:text="${enquiry.classMode}"></td>
				<td th:text="${enquiry.enquiryStatus}"></td>
				<td><a th:href="@{/update(enquiryId=${enquiry.enquiryId})}"
					class="btn btn-primary">Edit</a></td>
			</tr>
		</tbody>
	</table>
	<script src="css/bootstrap-5.0.2-dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
