<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport"
	content="width=device-width, initial-scale=1, shrink-to-fit=no" />
<meta http-equiv="x-ua-compatible" content="ie=edge" />
<title>Generic Enquiry Management System (GEMS) - View Enquries</title>
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
<!-- Google Fonts Roboto -->
<link rel="stylesheet"
	href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" />
<link rel="stylesheet" href="css/bootstrap-5.0.2-dist/css/bootstrap.min.css" />

<script src="/webjars/jquery/3.7.1/jquery.min.js"></script>
<script>
$(document).ready(function() {
	$(".form-select").on("change", function(e) {
		$.ajax({
			type: "GET",
			url: "filtered-enquiries",
			data: {
				course: $("#course").val(),
				status: $("#status").val(),
				mode: $("#mode").val()
			},
			success: function(result){
				$("#enquiryTable").remove();
				$("#filteredEnquiryTable").html(result);
			}
		})
	});
});
</script>
</head>
<body>
	<nav class="navbar navbar-expand-lg bg-body-tertiary">
		<div class="container-fluid">
			<a class="navbar-brand" href="#"> <img alt="Generic Enquiry Management System (GEMS)"
				src="images/logo.jpg" width=100%>
			</a>
			<div class="collapse navbar-collapse" id="navbarSupportedContent">
				<ul class="navbar-nav me-auto mb-2 mb-lg-0">
					<li class="nav-item"><a class="nav-link active"
						aria-current="page" href="dashboard">Home</a></li>
					<li class="nav-item"><a class="nav-link" href="enquiry">Add
							Enquiry</a></li>
					<li class="nav-item"><a class="nav-link" href="enquiries">View
							Enquiries</a></li>
				</ul>
				<a href="logout" class="btn btn-danger">Logout</a>
			</div>
		</div>
	</nav>
	<!-- Start your project here-->
	
	<section class="h-100 gradient-form" style="background-color: #eee;">
		<div class="container py-5 h-100">
			<div
				class="row d-flex justify-content-center align-items-center h-100">
				<div class="col-xl-10">
					<div class="card rounded-3 text-black">
						<div class="row g-0">
							<div class="col-lg-12">
								<div class="card-body p-md-5 mx-md-4">
									<div class="text-center">
										<h4 class="mt-1 mb-5 pb-1">View Student Enquiries</h4>
									</div>
									<div class="row">
										<div class="col-md-4 form-outline mb-4">
											<label class="form-label" for="course">Course</label>
											<select id="course" class="form-select">
												<option value="">-Select-</option>
												<option th:each="course : ${courseNames}" th:value="${course}" th:text="${course}"></option>
											</select>
										</div>
										<div class="col-md-4 form-outline mb-4">
											<label class="form-label" for="status">Enquiry Status</label>
											<select id="status" class="form-select">
												<option value="">-Select-</option>
												<option th:each="status : ${statusNames}" th:value="${status}" th:text="${status}"></option>
											</select>
										</div>
										<div class="col-md-4 form-outline mb-4">
											<label class="form-label" for="mode">Class Mode</label>
											<select id="mode" class="form-select">
												<option value="">-Select-</option>
												<option value="online">Online</option>
												<option value="classroom">Classroom</option>
											</select>
										</div>
									</div>
									<div id="filteredEnquiryTable"></div>
									<table class="table table-striped table-bordered table-hover" id="enquiryTable">
										<thead>
											<tr>
												<th scope="col">#</th>
												<th scope="col">Name</th>
												<th scope="col">Course</th>
												<th scope="col">Number</th>
												<th scope="col">Enquiry Date</th>
												<th scope="col">Updated Date</th>
												<th scope="col">Class Mode</th>
												<th scope="col">Status</th>
												<th scope="col">Action</th>
											</tr>
										</thead>
										<tbody>
											<tr th:each="enquiry : ${enquiries}">
												<th th:text="${enquiryStat.index} + 1"></th>
												<td th:text="${enquiry.studentName}"></td>
												<td th:text="${enquiry.courseName}"></td>
												<td th:text="${enquiry.studentPhoneNumber}"></td>
												<td th:text="${enquiry.createdDate}"></td>
												<td th:text="${enquiry.updatedDate}"></td>
												<td th:text="${enquiry.classMode}"></td>
												<td th:text="${enquiry.enquiryStatus}"></td>
												<td><a th:href="@{/update(enquiryId=${enquiry.enquiryId})}" class="btn btn-primary">Edit</a></td>
											</tr>
										</tbody>
									</table>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>
	<!-- End your project here-->
	<script src="css/bootstrap-5.0.2-dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
