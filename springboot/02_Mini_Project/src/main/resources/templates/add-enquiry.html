<!DOCTYPE html>
<html lang="en" xmlns:th="www.thmeleaf.org">

<head>
<meta charset="UTF-8" />
<meta name="viewport"
	content="width=device-width, initial-scale=1, shrink-to-fit=no" />
<meta http-equiv="x-ua-compatible" content="ie=edge" />
<title>Generic Enquiry Management System (GEMS)</title>
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
<!-- Google Fonts Roboto -->
<link rel="stylesheet"
	href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" />
<link rel="stylesheet" href="css/bootstrap-5.0.2-dist/css/bootstrap.min.css" />
</head>

<body>

	<nav class="navbar navbar-expand-lg bg-body-tertiary">
		<div class="container-fluid">
			<a class="navbar-brand" href="#"> <img alt="Generic Enquiry Management System (GEMS)"
				src="images/logo.jpg" width=100%>
			</a>
			<div class="collapse navbar-collapse" id="navbarSupportedContent">
				<ul class="navbar-nav me-auto mb-2 mb-lg-0">
					<li class="nav-item"><a class="nav-link active"
						aria-current="page" href="dashboard">Home</a></li>
					<li class="nav-item"><a class="nav-link" href="#">Add
							Enquiry</a></li>
					<li class="nav-item"><a class="nav-link" href="enquiries">View
							Enquiries</a></li>
				</ul>
				<a href="logout" class="btn btn-danger">Logout</a>
			</div>
		</div>
	</nav>
	<!-- Start your project here-->


	<section class="h-100 gradient-form" style="background-color: #eee;">
		<div class="container py-5 h-100">
			<div
				class="row d-flex justify-content-center align-items-center h-100">
				<div class="col-xl-10">
					<div class="card rounded-3 text-black">
						<div class="row g-0">
							<div class="col-lg-6">
								<div class="card-body p-md-5 mx-md-4">

									<div class="text-center">
										<h4 class="mt-1 mb-5 pb-1"
											th:text="${enquiryForm.enquiryId} ? 'Update Student Enquiry Here' : 'Add Student Enquriy Here'"></h4>
									</div>

									<form th:action="@{/enquiry}" th:object="${enquiryForm}"
										method="POST">
										<p th:text="${successMessage}" class="text-success" />
										<p th:text="${errorMessage}" class="text-danger" />
											<input type="hidden" id="form2Example10" class="form-control"
												th:field="*{enquiryId}" />
												
										<div class="mb-3">
											<label for="exampleFormControlInput1" class="form-label">Student Name</label>
											<input type="text" class="form-control" th:field="*{studentName}" 
												id="exampleFormControlInput1" placeholder="Student Name">
										</div>
												
										<div class="mb-3">
											<label for="exampleFormControlInput1" class="form-label">Contact Number</label>
											<input type="text" pattern="\d{10}" class="form-control" th:field="*{studentPhoneNumber}" 
												id="exampleFormControlInput1" placeholder="Student Phone Number">
										</div>

										<div class="mb-4">
											<label class="form-label" for="form2Example22">Class
												Mode</label> <select id="form2Example22" class="form-select"
												th:field="*{classMode}">
												<option value="">-Select-</option>
												<option value="online">Online</option>
												<option value="classroom">Classroom</option>
											</select>
										</div>

										<div class="mb-4">
											<label class="form-label" for="form2Example23">Course</label>
											<select id="form2Example23" class="form-select"
												th:field="*{courseName}">
												<option value="">-Select-</option>
												<option th:each="course : ${courseNames}"
													th:value="${course}" th:text="${course}"></option>
											</select>
										</div>
										<div class="mb-4">
											<label class="form-label" for="form2Example24">Enquiry Status</label>
											<select id="form2Example24" class="form-select"
												th:field="*{enquiryStatus}">
												<option value="">-Select-</option>
												<option th:each="enquiryStatus : ${enquiryStatusNames}"
													th:value="${enquiryStatus}" th:text="${enquiryStatus}"></option>
											</select>
										</div>
										<div class="text-center pt-1 mb-5 pb-1 d-grid">
											<button
												class="btn btn-primary btn-block fa-lg gradient-custom-2 mb-3"
												type="submit">Submit</button>
										</div>
									</form>

								</div>
							</div>
							<div class="col-lg-6 d-flex align-items-center gradient-custom-2">
								<img alt="" src="images/lady.jpg" width="70%">
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>
	<script src="css/bootstrap-5.0.2-dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
