<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="common-head(title)">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="${title}">Blog App</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link href="/css/styles.css" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body th:fragment="navbar">
	<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
		<div class="container">
			<a class="navbar-brand" href="/">Blog App</a>
			<button class="navbar-toggler" type="button"
				data-bs-toggle="collapse" data-bs-target="#navbars"
				aria-controls="navbars" aria-expanded="false"
				aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbars">
				<ul class="navbar-nav me-auto mb-2 mb-lg-0">
					<li class="nav-item"><a class="nav-link" href="/">Home</a></li>
					<li class="nav-item"><a class="nav-link" href="/blogs/add">Add
							Blog</a></li>
					<li th:if="${session.USER_ID != null}" class="nav-item"><a
						class="nav-link" th:href="@{/blogs/my-blogs}">My Blogs</a></li>
					<li th:if="${session.USER_ID != null}" class="nav-item"><a
						class="nav-link" th:href="@{/comments/my-comments}">My
							Comments</a></li>

				</ul>
				<ul class="navbar-nav ms-auto">
					<li th:if="${session.USER_ID == null}" class="nav-item"><a
						class="nav-link" href="/login">Login</a></li>
					<li th:if="${session.USER_ID == null}" class="nav-item"><a
						class="nav-link" href="/register">Register</a></li>
					<li th:if="${session.USER_ID != null}" class="nav-item"><span
						class="navbar-text text-white me-2 d-inline-block"
						th:text="${session.USER_NAME}">User</span></li>
					<li th:if="${session.USER_ID != null}" class="nav-item"><a
						class="nav-link" href="/logout">Logout</a></li>
				</ul>
			</div>
		</div>
	</nav>
</body>
</html>
