<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: common-head('Login')}"></head>
<body>
	<div th:replace="~{fragments/header :: navbar}"></div>
	<div class="container mt-4">
		<div class="row justify-content-center">
			<div class="col-md-6">
				<h3>Login</h3>

				<!-- Success message -->
				<div th:if="${success}" class="alert alert-success"
					th:text="${success}"></div>

				<!-- Error message -->
				<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

				<form th:action="@{/login}" th:object="${login}" method="post"
					novalidate>
					<div class="mb-3">
						<label class="form-label">Email</label> <input type="email"
							th:field="*{email}" class="form-control" required>
						<div th:if="${#fields.hasErrors('email')}" th:errors="*{email}"
							class="text-danger"></div>
					</div>
					<div class="mb-3">
						<label class="form-label">Password</label> <input type="password"
							th:field="*{password}" class="form-control" required>
						<div th:if="${#fields.hasErrors('password')}"
							th:errors="*{password}" class="text-danger"></div>
					</div>
					<button class="btn btn-primary" type="submit">Login</button>
				</form>
			</div>

		</div>
	</div>
	<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
