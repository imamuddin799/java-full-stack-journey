<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: common-head('Register')}"></head>
<body>
	<div th:replace="~{fragments/header :: navbar}"></div>
	<div class="container mt-4">
		<div class="row justify-content-center">
			<div class="col-md-6">
				<h3>Register</h3>
				<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
				<form th:action="@{/register}" th:object="${register}" method="post"
					novalidate>
					<div class="mb-3">
						<label class="form-label">Name</label> <input type="text"
							th:field="*{name}" class="form-control" required maxlength="120">
						<div th:if="${#fields.hasErrors('name')}" th:errors="*{name}"
							class="text-danger"></div>

					</div>
					<div class="mb-3">
						<label class="form-label">Email</label> <input type="email"
							th:field="*{email}" class="form-control" required maxlength="180">
						<div th:if="${#fields.hasErrors('email')}" th:errors="*{email}"
							class="text-danger"></div>

					</div>
					<div class="mb-3">
						<label class="form-label">Password</label> <input type="password"
							th:field="*{password}" class="form-control" required
							minlength="6" maxlength="100">
						<div th:if="${#fields.hasErrors('password')}"
							th:errors="*{password}" class="text-danger"></div>

					</div>
					<button class="btn btn-primary" type="submit">Register</button>
				</form>
			</div>
		</div>
	</div>
	<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
