                </div>
                <div class="form-floating mb-3">
                    <input type="date" class="form-control" id="dob" placeholder="Date of Birth : " name="dob">

                </div>
                <button type="submit" class="btn btn-outline-primary mb-3">Submit</button>
            </div>
        </div>
