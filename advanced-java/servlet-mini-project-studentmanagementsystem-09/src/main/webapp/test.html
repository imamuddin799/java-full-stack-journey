<!doctype html>
<html lang='en'>
<head><title>Student Details</title>
    <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css' rel='stylesheet'
        integrity='sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN' crossorigin='anonymous' />
</head><body class='bg-info'>
    <div class='container-fluid d-flex flex-column align-items-center justify-content-center' style='height : 100vh; width : 100wh;'>
        <h2 class='container bg-primary  col-6 rounded-3 py-1'>Registration Successful</h2>
        <div class='container bg-warning col-7 mt-3 py-2 rounded-3 align-self-center'>
            <h1 class='mb-3'>Student Details</h1>
            <div class='container border border-primary col-12 bg-info my-2 rounded-3'>
                <label for='name' class='h2 text-danger col-5'>Student Name : </label>
                <h2 class='d-inline col-7'>ER. IMAMUDDIN ANSARI</h2>
            </div>
            <div class='container border border-primary col-12 bg-info my-2 rounded-3'>
                <label for='name' class='h2 text-danger col-5'>Student Email : </label>
                <h2 class='d-inline col-7'>imamu033@gmail.com</h2>
            </div>
            <div class='container border border-primary col-12 bg-info my-2 rounded-3'>
                <label for='name' class='h2 text-danger col-5'>Student Phone : </label>
                <h2 class='d-inline col-7'>7033534143</h2>
            </div>
            <div class='container border border-primary col-12 bg-info my-2 rounded-3'>
                <label for='name' class='h2 text-danger col-5'>Student Date of Birth : </label>
                <h2 class='d-inline col-7'>21-10-2002</h2>
            </div>
            <div class='container col-12 px-0'>
                <form action='edit' method='post' class='d-inline'>
                    <button type='submit' class='btn btn-primary my-2 col-2 me-3'>Edit</button>
                </form>
                <button type='button' class='btn btn-danger col-2' data-bs-toggle='modal'
                    data-bs-target='#exampleModal'>Delete</button>
                <div class='modal' id='exampleModal' tabindex='-1' aria-labelledby='exampleModalLabel'
                    aria-hidden='true'>
                    <div class='modal-dialog modal-dialog-centered'>
                        <div class='modal-content'>
                            <div class='modal-header'>
                                <h5 class='modal-title text-danger' id='exampleModalLabel'>Warning</h5>
                                <button type='button' class='btn-close' data-bs-dismiss='modal'
                                    aria-label='Close'></button>
                            </div>
                            <div class='modal-body'>
                                <p class='text-dark my-1'>Are you sure?</p>
                                <p class='text-dark my-1'>Do you want to delete your account?</p>
                            </div>
                            <div class='modal-footer'>
                                <form action='delete' method='post' class='d-inline'>
                                    <button type='submit' class='btn btn-danger'>Delete</button>
                                </form>
                                <button type='button' class='btn btn-secondary' data-bs-dismiss='modal'>Close</button>
                            </div>
                        </div>
                    </div>
                </div>
                <script src='https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js'
                    integrity='sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r'
                    crossorigin='anonymous'></script>
                <script src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js'
                    integrity='sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+'
                    crossorigin='anonymous'></script>
            </div>
        </div>
    </div>
</body>

</html>
