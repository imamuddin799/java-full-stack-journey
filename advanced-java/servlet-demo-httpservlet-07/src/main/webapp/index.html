<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Insert title here</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body class="bg-warning">
    <form action="register" method="get">
        <div class="container-fluid">
            <div class="container col-4 my-3 border border-danger bg-info rounded">
                <div class="form-floating my-3">
                    <input type="number" name="eid" id="eid" class="form-control" placeholder="E-ID">
                    <label for="eid">Enter Employee ID : </label>
                </div>
                <div class="form-floating my-3">
                    <input type="text" name="ename" id="ename" class="form-control" placeholder="E-Name">
                    <label for="ename">Enter Employee Name : </label>
                </div>
                <div class="form-floating my-3">
                    <input type="date" name="hdate" id="hdate" class="form-control" placeholder="H-date">
                    <label for="hdate">Enter Employee Hire Date : </label>
                </div>
                <div class="form-floating my-3">
                    <input type="number" name="salary" id="salary" class="form-control" placeholder="Salary">
                    <label for="salary">Enter Employee Salary : </label>
                </div>
                <div class="form-floating my-3">
                    <input type="text" name="jobrole" id="jobrole" class="form-control" placeholder="Job Role">
                    <label for="jobrole">Enter Employee Job Role : </label>
                </div>
                <div class="form-floating my-3">
                    <input type="date" name="dateOfBirth" id="dateOfBirth" class="form-control"
                        placeholder="Date of Birth">
                    <label for="dateOfBirth">Enter Employee Date of Birth : </label>
                </div>
                <button type="submit" class="btn btn-outline-primary mb-3">Submit</button>
            </div>
        </div>
    </form>
</body>

</html>
