<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div style="border: 2px solid;">hi</div>
    <div>hello</div>

    <span style="border: 2px solid;">hi span</span>
    <span style="background-color: red;">bye span</span>

    <br><br><br>

    <style>
        #par{
            border: 2px solid;
            background-color: aqua;
        }
        #ch{
            background-color: red;
        }
        #par1{
            border: 2px solid;
        }
        #ch1{
            background-color: pink;
        }
    </style>

    <div id="par">
        hi
        <div id="ch">hello nested div</div>
        bye parent div
    </div>

    <br>

    <span id="par1">
        hi span parent
        <span id="ch1">hi nested child span</span>
        bye parent span
    </span>

    <div>
        hi
        <div>bye</div>
        <span>hello</span>
        bye
    </div>

    <!-- <span style="border: 2px  solid;">
        hi
        <div>hello</div>
    </span> -->

    <style>
        #d1{
            border: 2px solid;
            height: 100px;
            width: 100px;
        }
        #d2{
            border: 2px solid;
            height: 100px;
            width: 100px;
        }
    </style>

    <div id="d1">
        hi
    </div> <br>

    <span id="d2">
        hello
    </span>
</body>
</html>
