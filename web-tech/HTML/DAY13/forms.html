<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <label for="">last name</label>
        <input type="text" name="" id="" autocomplete="on"><br>
        <label for="">first name</label>
        <input type="text" name="" id="" autofocus required><br>
        <label for="">name</label>
        <input type="text" name="" id="" placeholder="enter ur name"><br>
        <label for="">password</label>
        <input type="password" name="" id="" minlength="4" maxlength="8"><br>
        <label for="">age:</label>
        <input type="number" name="" id="" min="1" max="150"><br>
        <label for="">hidden</label>
        <input type="text" name="" id="" hidden><br>
        <label for="">disabled</label>
        <input type="text" name="" id="" disabled><br>
        <label for="">value</label>
        <input type="text" name="" id="" value="web"><br>
        <label for="">Readonly</label>
        <input type="text" name="" id="" value="web" readonly><br>
        <label for="">country</label>
        <input type="text" name="" id="" required><br>
        <style>
            sup{
                color: red;
            }
        </style>
        <label for="">Qualification<sup>*</sup></label>
        <input type="text" name="" id="" required><br>
        <label for="">autocomplete</label>
        <input type="text" name="" id="" autocomplete="on"><br>
        <label for="">autocomplete1</label>
        <input type="text" name="" id="" autocomplete="off"><br>
        <label for="">password</label>
        <input type="password" name="" id="" pattern="[0-9]{5}"><br>
        <input type="password" name="" id="" pattern="[A-Z]{3}"><br>
        <textarea name="" id="" cols="10" rows="5"></textarea><br>
        <button>submit</button>
    </form>

    <select name="" id="">
        <option value="">-select-</option>
        <option value="">btech</option>
        <option value="">bcome</option>
        <option value="">bsc</option>
        <option value="">bba</option>
    </select><br>

    <input type="text" name="" list="d1">
    <datalist id="d1">
        <option value="india">india</option>
        <option value="us">us</option>
        <option value="uk">uk</option>
        <option value="canada">canada</option>
    </datalist>

    <style>
        fieldset{
            width: 200px;
        }
    </style>
    <fieldset>
        <legend align="center">Login</legend>
        <form action="">
            <label for=""></label>
            <input type="text" name="" id="">
            <input type="text" name="" id="">
            <input type="text" name="" id="">
            <input type="text" name="" id="">
        </form>
    </fieldset>
</body>
</html>
