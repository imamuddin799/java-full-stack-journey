<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
</head>

<body>
    <form action="#">
        <table border="2px solid">
            <tr>
                <td colspan="2" align="center">Registration Form</td>
                <!-- <td></td> -->
            </tr>
            <tr>
                <td>
                    <label for="student">Student</label>
                </td>
                <td>
                    <input type="text" name="" id="student" />
                </td>
            </tr>
            <tr>
                <td>
                    <label for="fname">Father's<br />Name</label>
                </td>
                <td>
                    <input type="text" name="" id="fname" />
                </td>
            </tr>
            <tr>
                <td>
                    <label for="mname">Mother's<br />Name</label>
                </td>
                <td>
                    <input type="text" name="" id="mname" />
                </td>
            </tr>
            <tr>
                <td>
                    <label for="dob">Date of<br />Birth</label>
                </td>
                <td>
                    <input type="date" name="" id="dob" />
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">Gender</label>
                </td>
                <td>
                    <label for="male">male</label>
                    <input type="radio" name="gender" id="male" />

                    <label for="female">female</label>
                    <input type="radio" name="gender" id="female" />
                </td>
            </tr>
            <tr>
                <td>
                    <label for="email">Email<br />ID</label>
                </td>
                <td>
                    <input type="email" name="" id="email" />
                </td>
            </tr>
            <tr>
                <td>
                    <label for="no">Mobile<br />No</label>
                </td>
                <td>
                    <input type="tel" name="" id="no" />
                </td>
            </tr>
            <tr>
                <td>
                    <label for="add">Address</label>
                </td>
                <td>
                    <textarea name="" id="add" cols="30" rows="10"></textarea>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="state">State</label>
                </td>
                <td><input type="text" name="" id="state" /></td>
            </tr>
            <tr>
                <td>
                    <label for="city">City</label>
                </td>
                <td>
                    <input type="text" name="" id="city" />
                </td>
            </tr>
            <tr>
                <td></td>
                <td><button>submit</button></td>
            </tr>
        </table>
    </form>
</body>

</html>
