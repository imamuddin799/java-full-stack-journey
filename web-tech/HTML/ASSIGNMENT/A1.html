<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>My feedback form</h1>
    <ul>
        <li>
            <label for="name">Name:</label>
            <input type="text" name="" id="name">
        </li>
        <li>
            <label for="email">Email:</label>
            <input type="email" name="" id="email">
        </li>
        <li>
            <label for="pass">Password:</label>
            <input type="password" name="" id="pass">
        </li><br>
        <li>
            Please check all the emotions that apply to you:
            <ul type="disc">
                <li>
                    <label for="c1">Angry</label>
                    <input type="checkbox" name="" id="c1">
                </li>
                <li>
                    <label for="c2">Sad</label>
                    <input type="checkbox" name="" id="c2">
                </li>
                <li>
                    <label for="c3">Happy</label>
                    <input type="checkbox" name="" id="c3">
                </li>
                <li>
                    <label for="c4">Ambivalent</label>
                    <input type="checkbox" name="" id="c4">
                </li>
            </ul>
        </li>
        <li>
            How satisfied were you with our service
            <ul type="disc">
                <li>
                    <label for="c5">Very satisfied</label>
                    <input type="checkbox" name="" id="c5">
                </li>
                <li>
                    <label for="c6">satisfied</label>
                    <input type="checkbox" name="" id="c6">
                </li>
                <li>
                    <label for="c7">Didn't care</label>
                    <input type="checkbox" name="" id="c7">
                </li>
                <li>
                    <label for="c8">Dissatisfied</label>
                    <input type="checkbox" name="" id="c8">
                </li>
                <li>
                    <label for="c9">Very dissatisfied</label>
                    <input type="checkbox" name="" id="c9">
                </li>
            </ul>
        </li>
        <li>
            <label for="comment">Further comments:</label>
            <textarea name="" id="comment" cols="30" rows="10"></textarea>
        </li><br>
        <li>
            <label for="photo">Bio photo:</label>
            <input type="text" name="" id="">
            <input type="file" name="" id="photo">
        </li>
        <li>
            <label for="loc">Location visited:</label>
            <input type="text" name="" id="loc" list="lid">
                <datalist id="lid">
                    <option value="Hyderabad">Hyderabad</option>
                    <option value="Mumbai">Mumbai</option>
                    <option value="Bihar">Bihar</option>
                </datalist>
        </li>
        <li>
            <input type="submit" name="" id="">
        </li>
    </ul>
</body>
</html>
