<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <table width="95%">
            <tr>
                <td>
                    <label for="fname">FirstName</label>
                </td>
                <td>
                    <input type="text" name="" id="fname"><span>(max 20 char a-z and A-Z)</span>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="lname">LastName</label>
                </td>
                <td>
                    <input type="text" name="" id="lname"><span>(max 20 char a-z and A-Z)</span>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="dob">Date of Birth</label>
                </td>
                <td>
                    <input type="date" name="" id="">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">GENDER</label>
                </td>
                <td>
                    <input type="radio" name="gender" id="male">
                    <label for="male">male</label>

                    <input type="radio" name="gender" id="female">
                    <label for="female">female</label>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="email">EMAIL ID</label>
                </td>
                <td>
                    <input type="email" name="" id="email">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="mob">Mobile No</label>
                </td>
                <td>
                    <input type="tel" name="" id="">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="add">Address</label>
                </td>
                <td>
                    <textarea name="" id="add" cols="30" rows="8"></textarea>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="city">CITY</label>
                </td>
                <td>
                    <input type="text" name="" id="city"><span>(max 20 char a-z and A-Z)</span>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="pin">PIN CODE</label>
                </td>
                <td>
                    <input type="number" name="" id="pin"><span>(6 digit number)</span>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="state">STATE</label>
                </td>
                <td>
                    <input type="text" name="" id="state">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="con">COUNTRY</label>
                </td>
                <td>
                    <input type="text" name="" id="con">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">HOBBIES</label>
                </td>
                <td>
                    <input type="checkbox" name="" id="draw">
                    <label for="draw">Drawing</label>

                    <input type="checkbox" name="" id="sing">
                    <label for="sing">Singing</label>

                    <input type="checkbox" name="" id="dance">
                    <label for="dance">Dancing</label><br>

                    <input type="checkbox" name="" id="other">
                    <label for="other">Others</label>
                    <input type="text" name="" id="">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">Qualification</label>
                </td>
                <td>
                    <table>
                        <tr align="center">
                            <td>sl.no</td>
                            <td>Examination</td>
                            <td>Board</td>
                            <td>Percentage</td>
                            <td>Year of passing</td>
                        </tr>
                        <tr>
                            <td>01</td>
                            <td>Class X</td>
                            <td>
                                <input type="text" name="" id="">
                            </td>
                            <td>
                                <input type="text" name="" id="">
                            </td>
                            <td><input type="text" name="" id=""></td>
                        </tr>
                        <tr>
                            <td>02</td>
                            <td>Class XII</td>
                            <td>
                                <input type="text" name="" id="">
                            </td>
                            <td>
                                <input type="text" name="" id="">
                            </td>
                            <td><input type="text" name="" id=""></td>
                        </tr>
                        <tr>
                            <td>03</td>
                            <td>Graduation</td>
                            <td>
                                <input type="text" name="" id="">
                            </td>
                            <td>
                                <input type="text" name="" id="">
                            </td>
                            <td><input type="text" name="" id=""></td>
                        </tr>
                        <tr>
                            <td>04</td>
                            <td>Master</td>
                            <td>
                                <input type="text" name="" id="">
                            </td>
                            <td>
                                <input type="text" name="" id="">
                            </td>
                            <td><input type="text" name="" id=""></td>
                        </tr>
                    </table>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">COURSES APPLIED FOR</label>
                </td>
                <td>
                    <input type="checkbox" name="" id="bsc">
                    <label for="bsc">BSC</label>

                    <input type="checkbox" name="" id="bcom">
                    <label for="bcom">B.com</label>

                    <input type="checkbox" name="" id="ba">
                    <label for="ba">B.A</label>
                </td>
            </tr>
            <tr>
                <td>
                    <input type="submit" name="" id="">
                </td>
                <td>
                    <input type="reset" name="" id="">
                </td>
            </tr>
        </table>
    </form>
    <br><br><br><br><br>
</body>
</html>
