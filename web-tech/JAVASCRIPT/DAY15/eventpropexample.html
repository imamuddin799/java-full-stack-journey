<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested Layout</title>
    <style>
        div{
            border: 2px solid;
        }

        #gp{
            height: 400px;
            width: 900px;
            margin: auto;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
        }
        #pc {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            border: none;
            display: flex;
            flex-direction: row;
            justify-content: space-evenly;
        }
        #p1{
            height: 300px;
            width: 350px;
            /* margin: auto; */
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
        }
        #p2{
            height: 300px;
            width: 350px;
            /* margin: auto; */
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
        }
        #p1ch{
            height: 200px;
            width: 200px;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
        }
        #p2ch{
            height: 200px;
            width: 200px;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
        }
        #gch{
            height: 100px;
            width: 100px;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
        }
    </style>
</head>
<body>
    <div id="gp">
        <p>GRAND PARENT</p>
        <div id="pc">
            <div id="p1">
                PARENT 1
                <div id="p1ch">
                    CHILD 1
                    <div id="gch">GRAND CHILD</div>
                </div>
            </div>
            <div id="p2">
                PARENT 2
                <div id="p2ch">
                    CHILD 2
                </div>
            </div>
        </div>
    </div>
    <script src="./eventpropexample.js"></script>
</body>
</html>
