<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <script>
        let day = "thursday";
        switch (day) {
            case "sunday": console.log("It is funday....!");break;
            case "monday": console.log("It is monday....!");break;
            case "tuesday": console.log("It is tuesday....!");break;
            case "wednesday": console.log("It is wednesday....!");break;
            case "thursday": console.log("It is thursday....!");break;
            case "friday": console.log("It is friday....!");break;
            case "saturday": console.log("It is saturday....!");break;
            default: console.log("no cases are matched");
        }
    </script>
</body>
